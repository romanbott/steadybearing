<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SteadyBearing</title>
  <desc id="desc">A fan impeller inside a bearing ring, with a damped response curve below it.</desc>

  <rect width="512" height="512" rx="112" fill="#12131a"/>

  <!-- Damped response curve: rises, overshoots slightly, settles. -->
  <path d="M70 458 C 108 458 130 446 160 432 C 190 418 210 430 234 438 C 258 446 276 430 300 424 C 338 414 372 432 404 432 C 424 432 436 428 442 428"
        fill="none" stroke="#c4b5fd" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="442" cy="428" r="8" fill="#c4b5fd"/>

  <!-- Bearing ring with an airflow gap at the upper right. -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#5eead4" stroke-width="20"
          pathLength="360" stroke-dasharray="300 60" stroke-linecap="round"/>

  <!-- Five swept impeller blades. -->
  <g fill="#5eead4">
    <path d="M256 212 C 290 182 344 182 380 206 C 404 222 414 250 406 276 C 376 292 324 288 290 266 C 270 253 258 234 256 212 Z"/>
    <path d="M256 212 C 290 182 344 182 380 206 C 404 222 414 250 406 276 C 376 292 324 288 290 266 C 270 253 258 234 256 212 Z" transform="rotate(72 256 256)"/>
    <path d="M256 212 C 290 182 344 182 380 206 C 404 222 414 250 406 276 C 376 292 324 288 290 266 C 270 253 258 234 256 212 Z" transform="rotate(144 256 256)"/>
    <path d="M256 212 C 290 182 344 182 380 206 C 404 222 414 250 406 276 C 376 292 324 288 290 266 C 270 253 258 234 256 212 Z" transform="rotate(216 256 256)"/>
    <path d="M256 212 C 290 182 344 182 380 206 C 404 222 414 250 406 276 C 376 292 324 288 290 266 C 270 253 258 234 256 212 Z" transform="rotate(288 256 256)"/>
  </g>

  <!-- Hub with a terminal cursor. -->
  <circle cx="256" cy="256" r="43" fill="#12131a" stroke="#5eead4" stroke-width="11"/>
  <path d="M242 242 L254 256 L242 270" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="264" y="266" width="20" height="7" rx="3.5" fill="#c4b5fd"/>
</svg>
