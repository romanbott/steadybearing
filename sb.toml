# SteadyBearing daemon configuration
# All fields are optional — defaults shown below.

socket_path = "/run/sb/sb.sock"

# Group ID that owns the socket (mode 0660). When unset the daemon's
# effective group is used; the systemd unit sets Group=sb.
# socket_gid = 1000

# --- Database ---

# Unified history database. Stores 10 s, 1 m, 10 m and 1 h tiers.
db_path = "/var/lib/sb/history.db"

# Seconds between DB flushes; 60 s keeps the 10 s view fresh.
db_flush_secs = 60

[retention]
# 10 s history is kept for one day; 1 m history for seven days.
# 10 m and 1 h history are kept forever.
ten_second_days = 1
minute_days = 7

# --- Fan control (hysteresis) ---

# Minimum PWM (0-255), never drops below this even when idling.
# ~43% speed = 110/255, silent airflow to flush NVMe heat
pwm_baseline = 110

# Temperature (°C) below which the fan begins slowing down
fan_soft_min = 40.0

# Temperature (°C) above which the fan begins speeding up
fan_soft_max = 60.0

# Temperature (°C) at which the fan ramps to 100% over hard_ramp_secs
fan_hard_max = 80.0

# Seconds the temperature must stay above/below threshold before reacting
fan_dwell_secs = 10.0

# PWM units to add or remove per adjustment step
fan_step = 5

# Seconds to ramp from current PWM to 255 when hard_max is hit
fan_hard_ramp_secs = 10.0

# Temperature (°C) below which PWM drifts back toward baseline
fan_drift_temp = 50.0

# Seconds per 1-unit PWM reduction when drifting
fan_drift_secs = 30.0
