# Build with:
#   VERSION=0.1.2 ARCH=amd64 nfpm package -f nfpm.yaml -p deb -t dist/
#
# The Makefile exports VERSION and ARCH and provides a `make deb` target.
name: sb
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Roman Contreras <roman.contreras@ciencias.unam.mx>
description: |
  SteadyBearing fan control daemon and TUI
  Samples CPU temperature, CPU usage, fan RPM and PWM, applies a hysteresis
  fan curve, and keeps tiered telemetry history in SQLite. Includes the sb
  terminal dashboard.
vendor: Roman Contreras
homepage: https://github.com/romanbott/steadybearing
license: GPL-3.0-or-later
depends:
  - systemd
  - libc6
  - libgcc-s1
contents:
  - src: target/release/sb-daemon
    dst: /usr/bin/sb-daemon
    file_info:
      mode: 0755
  - src: target/release/sb
    dst: /usr/bin/sb
    file_info:
      mode: 0755
  - src: sb-daemon.service
    dst: /usr/lib/systemd/system/sb-daemon.service
    file_info:
      mode: 0644
  - src: sb.toml
    dst: /etc/sb/sb.toml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/sysusers.d/sb.conf
    dst: /usr/lib/sysusers.d/sb.conf
    file_info:
      mode: 0644
  - src: dist/man/sb.1.gz
    dst: /usr/share/man/man1/sb.1.gz
    file_info:
      mode: 0644
  - src: dist/man/sb-daemon.1.gz
    dst: /usr/share/man/man1/sb-daemon.1.gz
    file_info:
      mode: 0644
  - src: dist/changelog.gz
    dst: /usr/share/doc/sb/changelog.gz
    file_info:
      mode: 0644
  - src: packaging/copyright
    dst: /usr/share/doc/sb/copyright
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/sb/README.md
    file_info:
      mode: 0644
scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
